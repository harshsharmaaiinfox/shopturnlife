<!-- Home Section Start -->

<!-- Hero Image Start -->
<section class="hero-image-section pt-0">
    <div class="container-fluid">
        <div class="hero-image">
            <img src="assets/images/banner-hero.png" alt="Shop Turn Life Hero Banner" class="img-fluid w-100" loading="lazy">
        </div>
    </div>
</section>
<!-- Hero Image End -->

<!-- Features Banner Section Start -->
<section class="features-banner-section">
    <div class="features-banner-bg"></div>
    <div class="container-fluid outer">
        <div class="features-banner-box">
            <div class="row g-0">
                <div class="col-md-4 col-12">
                    <div class="feature-item">
                        <div class="feature-icon">
                            <img src="assets/images/trending.png" alt="Trending Fashion Styles" class="img-fluid">
                        </div>
                        <div class="feature-text">
                            <span>Trending Fashion Styles</span>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-12">
                    <div class="feature-item">
                        <div class="feature-icon">
                            <img src="assets/images/quality.png" alt="100% Quality Checked" class="img-fluid">
                        </div>
                        <div class="feature-text">
                            <span>100% Quality Checked</span>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-12">
                    <div class="feature-item">
                        <div class="feature-icon">
                            <img src="assets/images/price.png" alt="Lowest Prices" class="img-fluid">
                        </div>
                        <div class="feature-text">
                            <span>Lowest Prices</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Features Banner Section End -->

<!-- Category Section Start -->
<section class="category-showcase-section">

                    </div>

                    <div class="category-showcase-item">

                            <div class="category-image-bg"></div>
                            <img src="assets/images/category-image-1.png" alt="Jackets" class="category-image">
                        </div>
                        <div class="category-label">
                            <span>Jackets</span>

                    </div>
                </div>
                <div class="col-6 col-sm-4 col-md-3 col-lg">
                    <div class="category-showcase-item">

                    </div>
                </div>
                <div class="col-6 col-sm-4 col-md-3 col-lg">
                    <div class="category-showcase-item">
                        <div class="category-image-wrapper">
                            <div class="category-image-bg"></div>
                            <img src="assets/images/category-image-4.png" alt="Shirt" class="category-image">
                        </div>
                        <div class="category-label">
                            <span>Shirt</span>
                        </div>
                    </div>
                </div>

        </div>

<!-- Gold Promotional Banner Section Start -->
<section class="gold-promotional-section">
    <div class="container-fluid">
        <div class="gold-promotional-wrapper">
            <div class="gold-main-banner">
                <div class="gold-banner-image">
                    <img src="assets/images/gold-banner.png" alt="Gold Brand Promotion" class="img-fluid">
                </div>
                <!-- Categories Overlay - Top Right -->
                <div class="gold-categories-overlay">

                            </div>
                            <div class="gold-category-label">
                                <span>Lehanga</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>
<!-- Gold Promotional Banner Section End -->

<!-- App Promotional Banner Section Start -->
<section class="app-promotional-section">
    <div class="container-fluid">
        <div class="app-promotional-wrapper">
            <div class="row g-0">
                <!-- Left Side - Orange Discount Section -->
                <div class="col-lg-4 col-md-12">
                    <div class="app-discount-section">
                        <div class="app-discount-content">
                            <div class="app-discount-label">Up to</div>
                            <div class="app-discount-amount">35% OFF</div>
                            <div class="app-discount-subtext">on first order</div>
                            <div class="app-discount-note">*Only on Shopturnlife.com</div>
                            <button class="app-download-btn">Shop Now</button>
                        </div>
                    </div>
                </div>
                <!-- Right Side - Purple Categories Section -->
                <div class="col-lg-8 col-md-12">
                    <div class="app-categories-section">
                        <div class="app-categories-grid">
                            <!-- Trending Now -->
                            <div class="app-category-panel">
                                <div class="app-category-image-wrapper">
                                    <img src="assets/images/top-pick.png" alt="Trending Now" class="app-category-image">
                                </div>
                                <button class="app-category-btn">Trending Now</button>
                            </div>
                            <!-- Budget Buys -->
                            <div class="app-category-panel">
                                <div class="app-category-image-wrapper">
                                    <img src="assets/images/budgetbuy.png" alt="Budget Buys" class="app-category-image">
                                </div>
                                <button class="app-category-btn">Budget Buys</button>
                            </div>
                            <!-- Top Rated Picks -->
                            <div class="app-category-panel">
                                <div class="app-category-image-wrapper">
                                    <img src="assets/images/toprated.png" alt="Top Rated Picks" class="app-category-image">
                                </div>
                                <button class="app-category-btn">Top Rated Picks</button>
                            </div>
                            <!-- Daily Essentials -->
                            <div class="app-category-panel">
                                <div class="app-category-image-wrapper">
                                    <img src="assets/images/dailyuse.png" alt="Daily Essentials" class="app-category-image">
                                </div>
                                <button class="app-category-btn">Daily Essentials</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- App Promotional Banner Section End -->

<!-- Collection Page Section with Filters Start -->
<section class="section-b-space shop-section" id="filtered_products">
    <div class="container-fluid">
        <div class="row">
            <div class="col-custome-3">
                <div class="left-box">
                    <app-collection-sidebar [filter]="filter"></app-collection-sidebar>
                </div>
            </div>
            <div class="col-custome-9">
                <div class="collection-heading" style="text-align: left; margin-bottom: 20px;">
                    <h2 style="font-weight: 700; color: inherit; margin: 0;">Products For You</h2>
                </div>
                <app-collection-products [filter]="filter"></app-collection-products>
            </div>
        </div>
    </div>
</section>
<!-- Collection Page Section with Filters End -->

<!-- Shop Trurn Life Banner End -->
<!-- Category Section Start -->
<section *ngIf="data?.content?.categories_icon_list?.status">
    <div class="container-fluid">
        <app-theme-categories [style]="'horizontal'" [theme]="'paris'" [sliderOption]="categorySlider" [categoryIds]="data?.content?.categories_icon_list?.category_ids || []" [image]="data?.content?.categories_icon_list?.image_url">
        </app-theme-categories>
    </div>
</section>
<!-- Category Section End -->
