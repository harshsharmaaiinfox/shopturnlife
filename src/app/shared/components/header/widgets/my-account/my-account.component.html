<!-- My Account Basic Style -->
<div *ngIf="style == 'basic'" class="profile-icon-wrapper">
    <div class="delivery-login-box simple-icon-box">
        <div class="delivery-icon">
            <i class="ri-user-line" *ngIf="!(isAuthenticated$ | async) else profile"></i>
            <ng-template #profile>
                <i class="ri-user-line"></i>
            </ng-template>
        </div>
        <span class="icon-label">{{ 'Profile' | translate }}</span>
    </div>
    <div class="onhover-div onhover-div-login">
        <div class="user-auth-box" *ngIf="!(isAuthenticated$ | async)">
            <h3 class="auth-title">{{ 'Hello' | translate }}</h3>
            <p class="auth-subtitle">{{ 'To access your account' | translate }}</p>
            <a [routerLink]="['/auth/register']" class="auth-signup-btn">{{ 'Sign Up' | translate }}</a>
        </div>
        <div class="user-auth-box authenticated-box" *ngIf="(isAuthenticated$ | async)">
            <h3 class="auth-title">{{ 'Hello' | translate }}</h3>
            <ul class="user-box-name">
                <li class="product-box-contain">
                    <a [routerLink]="['/account/dashboard']"><i class="ri-user-line me-2"></i> {{ 'My Account' | translate }}</a>
                </li>
                <li class="product-box-contain">
                    <a href="javascript:void(0)" (click)="confirmationModal.openModal()"><i class="ri-logout-box-r-line me-2"></i> {{ 'Logout' | translate }}</a>
                </li>
            </ul>
        </div>
    </div>
</div>

<app-confirmation-modal
    #confirmationModal
    (confirmed)="logout()">
</app-confirmation-modal>
